<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <title>UPCore Esports Dashboard</title>
    <meta name="description" content="A premium operations dashboard for UPCore Esports staff to monitor tickets, moderation, bot health, and command activity." />
    <meta name="robots" content="index, follow" />
    <meta property="og:title" content="UPCore Esports Dashboard" />
    <meta property="og:description" content="Monitor the UPCore Esports community from one polished operations cockpit." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="UPCore Esports Dashboard" />
    <meta name="twitter:description" content="Monitor the UPCore Esports community from one polished operations cockpit." />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root">
      <div id="boot-state" style="min-height:100vh;display:grid;place-items:center;background:#0d1018;color:#d7ff3f;font:600 12px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.14em;text-transform:uppercase">
        Loading UPCore dashboard…
      </div>
    </div>
    <script>
      (function () {
        var showStartupError = function () {
          var state = document.getElementById('boot-state');
          if (!state) return;
          state.innerHTML = 'Dashboard could not start. Please refresh this page.';
          state.style.color = '#ff8760';
          state.style.textAlign = 'center';
          state.style.padding = '24px';
        };
        // Only report a true module/bootstrap failure. React removes this
        // element once it mounts; API errors are rendered by the app itself.
        window.setTimeout(showStartupError, 10000);
      })();
    </script>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
